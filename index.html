    <!-- Fonts and icons load WITHOUT blocking the first paint (they used to cost ~2.5 s):
         text shows in the system font and swaps when the web font arrives (display=swap).
         Roboto Slab = the admin's display face (DR-013); IBM Plex = the public pages (home.css). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin onload="this.onload=null;this.rel='stylesheet'" />
